<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A «Стол»: две строчные t с общей перекладиной = столешница на двух ножках.
       В тёмной теме браузера ножки светлые, иначе значок теряется на тёмной панели вкладок. -->
  <style>
    .leg { stroke: #0e1726; }
    @media (prefers-color-scheme: dark) { .leg { stroke: #f4efe6; } }
  </style>
  <path class="leg" d="M30 16 V68 Q30 84 46 84" stroke-width="13"/>
  <path class="leg" d="M66 16 V68 Q66 84 82 84" stroke-width="13"/>
  <path d="M14 38 H86" stroke="#c9a45c" stroke-width="13"/>
</svg>
